<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>DONKEY KONG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #f5a623; letter-spacing: 0.2em; }
    #hud { display: flex; gap: 32px; margin-bottom: 8px; font-size: 0.9rem; }
    #hud span { background: #111; padding: 3px 14px; border-radius: 12px; border: 1px solid #333; }
    canvas { background: #000010; border: 2px solid #333; display: block; }
    #message { margin-top: 12px; font-size: 1rem; color: #f5a623; min-height: 1.5em; text-align: center; }
    #controls { margin-top: 8px; font-size: 0.78rem; color: #555; text-align: center; }
  </style>
</head>
<body>
  <h1>DONKEY KONG</h1>
  <div id="hud">
    <span>SCORE <strong id="score">0</strong></span>
    <span>LIVES <strong id="lives">3</strong></span>
    <span>STAGE <strong id="stage">1</strong></span>
  </div>
  <canvas id="gameCanvas" width="480" height="560"></canvas>
  <div id="message">Space / Enter でスタート</div>
  <div id="controls">← → 移動 &nbsp;|&nbsp; ↑ / Z ジャンプ &nbsp;|&nbsp; ↑ ↓ ハシゴ</div>
  <script src="main.js"></script>
</body>
</html>
