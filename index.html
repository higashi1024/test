<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロック崩し</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      letter-spacing: 0.1em;
      color: #e94560;
    }

    #hud {
      display: flex;
      gap: 40px;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    #hud span {
      background: #16213e;
      padding: 4px 16px;
      border-radius: 20px;
      border: 1px solid #0f3460;
    }

    canvas {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 4px;
      display: block;
    }

    #message {
      margin-top: 16px;
      font-size: 1.1rem;
      min-height: 1.5em;
      color: #e94560;
    }

    #controls {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>ブロック崩し</h1>
  <div id="hud">
    <span>スコア: <strong id="score">0</strong></span>
    <span>ライフ: <strong id="lives">3</strong></span>
    <span>レベル: <strong id="level">1</strong></span>
  </div>
  <canvas id="gameCanvas" width="480" height="520"></canvas>
  <div id="message"></div>
  <div id="controls">← → キー または マウスでパドルを操作 | Space でスタート</div>
  <script src="main.js"></script>
</body>
</html>
